name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP 8.2 quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ctype, iconv, pdo_sqlite, simplexml
          coverage: xdebug
          tools: composer:v2

      - name: Set up Node for documentation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Coding standards
        run: make cs

      - name: Symfony/Twig/YAML lint
        run: make lint

      - name: Verify migrations from a clean database
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite:///%kernel.project_dir%/var/ci.db"
        run: |
          mkdir -p var
          rm -f var/ci.db
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate

      - name: PHPUnit
        run: make test

      - name: Coverage gate
        run: make coverage COVERAGE_MIN=90

      - name: Build and smoke-test documentation
        run: make docs-smoke

      - name: Start generated HTML documentation server
        run: docker compose up -d docs

      - name: Smoke test documentation over HTTP
        run: |
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8088/healthz | grep -qx "ok"; then
              ready=1
              break
            fi
            echo "Attempt ${i}: waiting for documentation server health check..."
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Documentation server did not become healthy."
            docker compose ps docs
            docker compose logs docs
            exit 1
          fi

          check_page() {
            url="$1"
            expected="$2"
            echo "Checking ${url}"
            if ! curl --fail --silent --show-error "$url" | grep -Fq "$expected"; then
              echo "Documentation page check failed: ${url} (expected: ${expected})"
              docker compose ps docs
              docker compose logs docs
              exit 1
            fi
          }

          check_page "http://127.0.0.1:8088/" "Trustindex Reviews documentation"
          check_page "http://127.0.0.1:8088/DEVELOPER_GUIDE" "Developer guide"
          check_page "http://127.0.0.1:8088/DEVELOPER_HANDBOOK" "Generated developer handbook"
          check_page "http://127.0.0.1:8088/testing" "Testing strategy"
          check_page "http://127.0.0.1:8088/operations" "Operations"
          check_page "http://127.0.0.1:8088/architecture/" "Architecture"
          check_page "http://127.0.0.1:8088/code-reference/" "Generated code reference"

      - name: Upload HTML documentation
        uses: actions/upload-artifact@v4
        with:
          name: trustindex-documentation-html
          path: docs/dist
          if-no-files-found: error
          retention-days: 14

      - name: Stop documentation server
        if: always()
        run: docker compose stop docs

  demo-container:
    name: Disposable demo server smoke test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build demo image
        run: docker build -t trustindex-demo .

      - name: Start disposable test server
        run: docker run -d --name trustindex-demo -p 8080:8000 trustindex-demo

      - name: Smoke test public routes
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8080/ | grep -q "Trustindex Reviews"
          curl --fail --silent http://127.0.0.1:8080/companies | grep -q "Aggregated company statistics"
          curl --fail --silent http://127.0.0.1:8080/reviews/new | grep -q "Write a review"

      - name: Print container logs on failure
        if: failure()
        run: docker logs trustindex-demo
