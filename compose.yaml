services:
  app:
    build:
      context: .
    ports:
      - "8080:8000"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: local-demo-secret
      DATABASE_URL: sqlite:////app/var/demo.db
    volumes:
      - demo_var:/app/var

  docs:
    image: nginx:1.27-alpine
    ports:
      - "${DOCS_PORT:-8088}:80" # default documented port contract: 8088:80
    volumes:
      - ./docs/dist:/usr/share/nginx/html:ro
      - ./docker/nginx-docs.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s

volumes:
  demo_var:
