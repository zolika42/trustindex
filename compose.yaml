services:
  app:
    build:
      context: .
    ports:
      - "8080:8000"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: local-demo-secret
      DATABASE_URL: sqlite:////app/var/demo.db
    volumes:
      - demo_var:/app/var

  docs:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./docs/dist:/usr/share/nginx/html:ro

volumes:
  demo_var:
