server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # VitePress is configured with cleanUrls=true. Resolve clean links such as
    # /DEVELOPER_GUIDE and /testing to the generated .html files while keeping
    # directory-style pages such as /architecture/ and /code-reference/ valid.
    location / {
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }

    # Lightweight endpoint used by Docker/CI readiness checks. It deliberately
    # does not depend on a particular documentation page title or generated copy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
